<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recipe Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="container mt-4">

<h2 class="text-center mb-4">Recipe Management</h2>

<form action="recipe" method="post">

    <div class="mb-3">
        <label class="form-label">Recipe Name</label>
        <input type="text" class="form-control"
               name="recipeName" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Cuisine Type</label>
        <input type="text" class="form-control"
               name="cuisineType" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Cooking Time (Minutes)</label>
        <input type="number" class="form-control"
               name="cookingTime" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Difficulty Level</label>

        <select class="form-select" name="difficulty">

            <option value="">Select</option>
            <option>Easy</option>
            <option>Medium</option>
            <option>Hard</option>

        </select>

    </div>

    <div class="mb-3">
        <label class="form-label">Ingredients Count</label>
        <input type="number" class="form-control"
               name="ingredients" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Calories</label>
        <input type="number" class="form-control"
               name="calories" required>
    </div>

    <button class="btn btn-primary">
        Save Recipe
    </button>

</form>

</body>
</html>
